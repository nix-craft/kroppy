name: build

on:
  # Manual only (Nick, Nov 4 2026): run from the Actions tab or `gh workflow run build`.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux system libs for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libjpeg-turbo-progs jbig2 jbig2dec patchelf
      - run: python -m pip install -e . pytest
      - run: python -m pytest -v

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,     name: macos-arm64 }
          - { os: macos-15-intel,   name: macos-x86_64 }
          - { os: windows-latest,   name: windows-x64 }
          - { os: ubuntu-22.04,     name: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      KROP_LOG: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Linux system libs for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 file desktop-file-utils \
            jbig2 jbig2dec libjpeg-turbo-progs patchelf

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Install codec tools (macOS)
        if: runner.os == 'macOS'
        run: brew install jbig2enc jbig2dec jpeg-turbo

      - name: Install MSYS2 codec toolchain (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-leptonica
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-jbig2dec
            autoconf
            automake
            libtool
            make

      - name: Build jbig2enc (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          git clone --depth 1 --branch 0.29 https://github.com/agl/jbig2enc.git /tmp/jbig2enc
          cd /tmp/jbig2enc
          ./autogen.sh
          ./configure --prefix=/ucrt64
          make -j"$(nproc)"
          make install
          command -v jbig2
          command -v jpegtran
          if ! command -v jbig2dec >/dev/null; then
            git clone --depth 1 --branch 0.20 https://github.com/ArtifexSoftware/jbig2dec.git /tmp/jbig2dec
            cd /tmp/jbig2dec
            ./autogen.sh
            ./configure --prefix=/ucrt64
            make -j"$(nproc)"
            make install
          fi

      - name: Stage codec binaries and licenses
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="/c/msys64/ucrt64/bin:$PATH"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            # jpeg-turbo is keg-only; its jpegtran is not on the default PATH
            export PATH="$(brew --prefix jpeg-turbo)/bin:$PATH"
          fi
          python packaging/stage_codecs.py --dest packaging/codecs
          python packaging/smoke_codecs.py --bin packaging/codecs/bin

      - name: Version
        id: ver
        run: echo "v=$(python -c 'import krop.version as v; print(v.__version__)')" >> "$GITHUB_OUTPUT"

      - name: PyInstaller
        run: |
          SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; fi
          ARGS=(--noconfirm --clean --name kroppy --windowed --paths .
                --hidden-import krop.application --hidden-import krop.mainwindow
                --hidden-import krop.hardcrop --hidden-import pikepdf --hidden-import numpy
                --hidden-import PIL --hidden-import PIL.Image
                --collect-submodules krop --collect-all pikepdf --collect-all PIL
                --add-data "krop/mainwindow.ui${SEP}krop"
                --exclude-module PyQt5 --exclude-module popplerqt5 --exclude-module tkinter)
          for f in packaging/codecs/bin/*; do ARGS+=(--add-binary "${f}${SEP}codecs"); done
          for f in packaging/codecs/licenses/*; do ARGS+=(--add-data "${f}${SEP}codecs/licenses"); done
          if [ "$RUNNER_OS" = "macOS" ]; then ARGS+=(--osx-bundle-identifier com.arminstraub.krop); fi
          if [ "$RUNNER_OS" = "Windows" ]; then ARGS+=(--onefile); fi
          pyinstaller "${ARGS[@]}" packaging/krop_launcher.py
          ls -la dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            python packaging/smoke_codecs.py --archive dist/kroppy.exe
          else
            python packaging/smoke_codecs.py --dist dist
          fi

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          APPDIR=kroppy.AppDir
          mkdir -p $APPDIR/usr/bin $APPDIR/usr/share/applications $APPDIR/usr/share/icons/hicolor/scalable/apps
          cp -a dist/kroppy/. $APPDIR/usr/bin/
          cp com.arminstraub.krop.desktop $APPDIR/
          sed -i 's/^TryExec=.*/TryExec=kroppy/' $APPDIR/com.arminstraub.krop.desktop
          cp com.arminstraub.krop.desktop $APPDIR/usr/share/applications/
          cp com.arminstraub.krop.svg $APPDIR/
          cp com.arminstraub.krop.svg $APPDIR/usr/share/icons/hicolor/scalable/apps/
          # appimagetool requires .DirIcon to be a PNG
          sudo apt-get install -y -q librsvg2-bin
          rsvg-convert -w 256 -h 256 com.arminstraub.krop.svg -o $APPDIR/.DirIcon
          file $APPDIR/.DirIcon
          cat > $APPDIR/AppRun <<'EOS'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/kroppy" "$@"
          EOS
          sed -i 's/^          //' $APPDIR/AppRun
          chmod +x $APPDIR/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run $APPDIR "kroppy-${{ steps.ver.outputs.v }}-x86_64.AppImage"
          mkdir -p out && mv kroppy-*.AppImage out/
          echo "BIN=$PWD/out/kroppy-${{ steps.ver.outputs.v }}-x86_64.AppImage" >> $GITHUB_ENV
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> $GITHUB_ENV

      - name: Package (macOS zip + dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          B="kroppy-${{ steps.ver.outputs.v }}-${{ matrix.name }}"
          # --name kroppy names the .app; keep the bundle id (com.arminstraub.krop).
          PLIST=dist/kroppy.app/Contents/Info.plist
          for key in CFBundleName CFBundleDisplayName; do
            /usr/libexec/PlistBuddy -c "Set :$key kroppy" "$PLIST" \
              || /usr/libexec/PlistBuddy -c "Add :$key string kroppy" "$PLIST"
          done
          ditto -c -k --keepParent dist/kroppy.app "out/$B.app.zip"
          hdiutil create -volname kroppy -srcfolder dist/kroppy.app -ov -format UDZO "out/$B.dmg"
          echo "BIN=$PWD/dist/kroppy.app/Contents/MacOS/kroppy" >> $GITHUB_ENV

      - name: Package (Windows exe)
        if: runner.os == 'Windows'
        run: |
          mkdir -p out
          cp dist/kroppy.exe "out/kroppy-${{ steps.ver.outputs.v }}-windows-x64.exe"
          echo "BIN=$PWD/out/kroppy-${{ steps.ver.outputs.v }}-windows-x64.exe" >> $GITHUB_ENV

      - name: Smoke test (headless open, trim, save)
        timeout-minutes: 10
        run: |
          python packaging/make_test_pdf.py smoke.pdf
          T=""; command -v timeout >/dev/null && T="timeout 180"
          command -v gtimeout >/dev/null && T="gtimeout 180"
          $T "$BIN" --version
          $T "$BIN" --help > /dev/null
          $T "$BIN" --go --trim --trim-use all --optimize no --log off -o smoke-out.pdf smoke.pdf
          python packaging/check_output.py smoke-out.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: kroppy-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: artifacts/**/*
