name: build

on:
  push:
    branches: [next]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux system libs for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - run: python -m pip install PyQt6 pymupdf pytest
      - run: python -m pytest -v

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,     name: macos-arm64 }
          - { os: macos-15-intel,   name: macos-x86_64 }
          - { os: windows-latest,   name: windows-x64 }
          - { os: ubuntu-22.04,     name: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      KROP_LOG: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Linux system libs for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 file desktop-file-utils

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 pymupdf pyinstaller

      - name: Version
        id: ver
        run: echo "v=$(python -c 'import krop.version as v; print(v.__version__)')" >> "$GITHUB_OUTPUT"

      - name: PyInstaller
        run: |
          ARGS=(--noconfirm --clean --name krop --windowed --paths .
                --hidden-import krop.application --hidden-import krop.mainwindow
                --collect-submodules krop --add-data "krop/mainwindow.ui${{ runner.os == 'Windows' && ';' || ':' }}krop"
                --exclude-module PyQt5 --exclude-module popplerqt5 --exclude-module tkinter)
          if [ "$RUNNER_OS" = "macOS" ]; then ARGS+=(--osx-bundle-identifier com.arminstraub.krop); fi
          if [ "$RUNNER_OS" = "Windows" ]; then ARGS+=(--onefile); fi
          pyinstaller "${ARGS[@]}" packaging/krop_launcher.py
          ls -la dist

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          APPDIR=krop.AppDir
          mkdir -p $APPDIR/usr/bin $APPDIR/usr/share/applications $APPDIR/usr/share/icons/hicolor/scalable/apps
          cp -a dist/krop/. $APPDIR/usr/bin/
          cp com.arminstraub.krop.desktop $APPDIR/
          sed -i 's/^TryExec=.*/TryExec=krop/' $APPDIR/com.arminstraub.krop.desktop
          cp com.arminstraub.krop.desktop $APPDIR/usr/share/applications/
          cp com.arminstraub.krop.svg $APPDIR/
          cp com.arminstraub.krop.svg $APPDIR/usr/share/icons/hicolor/scalable/apps/
          # appimagetool requires .DirIcon to be a PNG
          sudo apt-get install -y -q librsvg2-bin
          rsvg-convert -w 256 -h 256 com.arminstraub.krop.svg -o $APPDIR/.DirIcon
          file $APPDIR/.DirIcon
          cat > $APPDIR/AppRun <<'EOS'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/krop" "$@"
          EOS
          sed -i 's/^          //' $APPDIR/AppRun
          chmod +x $APPDIR/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run $APPDIR "krop-trimall-${{ steps.ver.outputs.v }}-x86_64.AppImage"
          mkdir -p out && mv krop-trimall-*.AppImage out/
          echo "BIN=$PWD/out/krop-trimall-${{ steps.ver.outputs.v }}-x86_64.AppImage" >> $GITHUB_ENV
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> $GITHUB_ENV

      - name: Package (macOS zip + dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          B="krop-trimall-${{ steps.ver.outputs.v }}-${{ matrix.name }}"
          ditto -c -k --keepParent dist/krop.app "out/$B.app.zip"
          hdiutil create -volname krop -srcfolder dist/krop.app -ov -format UDZO "out/$B.dmg"
          echo "BIN=$PWD/dist/krop.app/Contents/MacOS/krop" >> $GITHUB_ENV

      - name: Package (Windows exe)
        if: runner.os == 'Windows'
        run: |
          mkdir -p out
          cp dist/krop.exe "out/krop-trimall-${{ steps.ver.outputs.v }}-windows-x64.exe"
          echo "BIN=$PWD/out/krop-trimall-${{ steps.ver.outputs.v }}-windows-x64.exe" >> $GITHUB_ENV

      - name: Smoke test (headless open, trim, save)
        timeout-minutes: 10
        run: |
          python packaging/make_test_pdf.py smoke.pdf
          T=""; command -v timeout >/dev/null && T="timeout 180"
          command -v gtimeout >/dev/null && T="gtimeout 180"
          $T "$BIN" --version
          $T "$BIN" --help > /dev/null
          $T "$BIN" --go --trim --trim-use all --optimize no --log off -o smoke-out.pdf smoke.pdf
          python packaging/check_output.py smoke-out.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: krop-trimall-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: artifacts/**/*
